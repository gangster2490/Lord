services:
  - type: web
    name: tiktok-shop-creator-proxy
    runtime: node
    rootDir: proxy
    buildCommand: "npm install --omit=dev"
    startCommand: "node server.js"
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
