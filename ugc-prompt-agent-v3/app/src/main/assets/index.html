<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>UGC Prompt Agent V3</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div>
        <p class="eyebrow" data-i18n="app_eyebrow">UGC Prompt Agent V3</p>
        <h1 id="screenTitle" data-i18n="home_title">Neues Projekt</h1>
      </div>
      <button id="btnSettings" class="icon-btn" data-i18n-title="settings">⚙</button>
    </header>

    <ol id="steps" class="steps" hidden></ol>

    <main id="pages"></main>

    <nav class="bottom-nav" id="homeNav">
      <button data-nav="home" class="active" data-i18n="nav_home">Home</button>
      <button data-nav="history" data-i18n="nav_history">Verlauf</button>
      <button data-nav="settings" data-i18n="nav_settings">Settings</button>
    </nav>
  </div>

  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <h2 id="modalTitle"></h2>
      <p id="modalBody"></p>
      <div class="row" id="modalActions"></div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
