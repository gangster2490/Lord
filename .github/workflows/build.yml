name: Build APK

on:
  push:
    branches: [main, 'cursor/**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ugc-prompt-agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Optional secret keystore override
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > keystore/release.keystore
            echo "Using KEYSTORE_BASE64 secret as signing store."
          else
            echo "Using committed release keystore (PKCS12, alias ugcagent)."
          fi

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify APK signature
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          echo "APK=$APK"
          SIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort | tail -n 1)
          "$SIGNER" verify --print-certs "$APK"
          unzip -l "$APK" | grep -E 'META-INF/.*\.(RSA|SF|MF)|BNDL|CERT' || true

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ugc-prompt-agent-apk
          path: ugc-prompt-agent/app/build/outputs/apk/release/*.apk
          retention-days: 30
