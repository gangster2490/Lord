name: UGC Clean

on:
  push:
    branches: [main, 'cursor/**', 'claude/**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ugc-clean
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Source audit
        working-directory: .
        run: |
          set -euo pipefail
          ROOT="ugc-clean/app/src/main"
          grep -q "applicationId = \"de.spardirekt.ugcclean\"" ugc-clean/app/build.gradle.kts
          grep -q 'namespace = "de.spardirekt.ugcclean"' ugc-clean/app/build.gradle.kts
          grep -q 'INTERNET' "$ROOT/AndroidManifest.xml"
          test -f "$ROOT/java/de/spardirekt/ugcclean/gen/PromptComposer.kt"
          test -f "$ROOT/java/de/spardirekt/ugcclean/MainActivity.kt"
          test -f "$ROOT/java/de/spardirekt/ugcclean/net/GeminiClient.kt"
          test -f "$ROOT/java/de/spardirekt/ugcclean/net/ClaudeClient.kt"
          grep -q 'enum class AiProviderId' "$ROOT/java/de/spardirekt/ugcclean/net/AiProvider.kt"
          grep -q 'CLAUDE' "$ROOT/java/de/spardirekt/ugcclean/net/AiProvider.kt"
          test -f ugc-clean/app/src/test/java/de/spardirekt/ugcclean/gen/V4AcceptanceTest.kt
          if grep -R -n --include='*.kt' --include='*.js' --include='*.html' 'localStorage.getItem' "$ROOT"; then
            echo "SOURCE AUDIT FAIL: localStorage"; exit 1
          fi
          echo "SOURCE AUDIT PASS"

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Assemble signed release
        env:
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_BASE64 && 'skip' || '' }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Validate APKs
        run: |
          set -e
          DEBUG_APK=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          RELEASE_APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          test -s "$DEBUG_APK"
          test -s "$RELEASE_APK"
          SIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort | tail -n 1)
          if [ -z "$SIGNER" ]; then SIGNER=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/*/apksigner | sort | tail -n 1); fi
          "$SIGNER" verify --print-certs "$RELEASE_APK"
          aapt=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt 2>/dev/null | sort | tail -n 1)
          "$aapt" dump badging "$DEBUG_APK" | grep -q "package: name='de.spardirekt.ugcclean.debug'"
          "$aapt" dump badging "$RELEASE_APK" | grep -q "package: name='de.spardirekt.ugcclean'"
          "$aapt" dump badging "$RELEASE_APK" | grep -q "versionName='1.1.0'"
          "$aapt" dump permissions "$RELEASE_APK" | grep -q INTERNET
          "$aapt" dump strings "$RELEASE_APK" | grep -q "Claude (Anthropic)"
          "$aapt" dump strings "$RELEASE_APK" | grep -q "sk-ant"
          python3 -c "import zipfile,sys; z=zipfile.ZipFile('$RELEASE_APK'); found=any(n.endswith('.dex') and b'ClaudeClient' in z.read(n) for n in z.namelist()); sys.exit(0 if found else 'ClaudeClient missing from release APK')"
          mkdir -p dist
          cp "$DEBUG_APK" dist/ugc-clean-debug.apk
          cp "$RELEASE_APK" dist/ugc-clean-release.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ugc-clean-debug.apk
          path: ugc-clean/dist/ugc-clean-debug.apk
          retention-days: 30

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: ugc-clean-release.apk
          path: ugc-clean/dist/ugc-clean-release.apk
          retention-days: 30
