name: svoe

on:
  push:
    paths:
      - "svoe/**"
      - ".github/workflows/svoe.yml"
  pull_request:
    paths:
      - "svoe/**"
      - ".github/workflows/svoe.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: svoe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - run: ./gradlew :domain:test assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: svoe-debug
          path: svoe/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
