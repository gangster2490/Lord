plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore/keystore.properties')
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

def envOrProp = { String envName, String propName, String fallback ->
    def env = System.getenv(envName)
    if (env != null && !env.trim().isEmpty()) return env.trim()
    def prop = keystoreProps.getProperty(propName)
    if (prop != null && !prop.trim().isEmpty()) return prop.trim()
    return fallback
}

android {
    namespace 'de.spardirekt.ugcagent'
    compileSdk 34

    defaultConfig {
        applicationId 'de.spardirekt.ugcagent'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '2.0.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    signingConfigs {
        release {
            storeFile rootProject.file(envOrProp('KEYSTORE_FILE', 'storeFile', 'keystore/release.keystore'))
            storePassword envOrProp('KEYSTORE_PASSWORD', 'storePassword', '')
            keyAlias envOrProp('KEY_ALIAS', 'keyAlias', 'ugcagent')
            keyPassword envOrProp('KEY_PASSWORD', 'keyPassword', '')
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        buildConfig true
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.google.truth:truth:1.4.4'
}
